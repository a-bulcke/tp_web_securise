services:
  # ----- Reverse proxy / HTTPS automatique -----
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks: [web]

  # ----- MySQL (jamais expose sur Internet) -----
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-projet}
      MYSQL_USER: ${DB_USER:-projet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----- Broker MQTT (TLS externe, reseau interne pour le bridge) -----
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    networks: [internal]

  # ----- Bridge : recopie les messages MQTT vers MySQL -----
  mqtt-bridge:
    profiles: [php, django]
    build: ./mqtt-bridge
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_BRIDGE_USER}
      - MQTT_PASSWORD=${MQTT_BRIDGE_PASSWORD}
      - MQTT_TOPIC=capteurs/#
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-projet}
      - DB_USER=${DB_USER:-projet}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ----- Variante PHP : nginx + php-fpm -----
  php-web:
    profiles: [php]
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./php/public:/var/www/html:ro
      - ./php/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [web, internal]

  php-fpm:
    profiles: [php]
    build: ./php
    restart: unless-stopped
    volumes:
      - ./php/public:/var/www/html:ro
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_NAME=${DB_NAME:-projet}
      - DB_USER=${DB_USER:-projet}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ----- Variante Django : gunicorn + MySQL -----
  django:
    profiles: [django]
    build: ./django
    restart: unless-stopped
    command: sh -c "python manage.py migrate && gunicorn monprojet.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Definir DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=${DOMAIN:-localhost}
      - DATABASE_URL=mysql://${DB_USER:-projet}:${DB_PASSWORD}@db:3306/${DB_NAME:-projet}
    volumes:
      - ./django/static:/app/static
      - ./django/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks: [web, internal]

volumes:
  db_data:
  caddy_data:
  caddy_config:
  mosquitto_data:

networks:
  web:
  internal: